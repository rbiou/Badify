name: Badminton Slot Monitor

on:
  schedule:
    # Every 10 minutes → incremental alert (new slots only)
    - cron: "*/10 * * * *"
    # Every Friday at 4pm UTC = 5pm Paris (CET) / 6pm (CEST in summer
    - cron: "0 16 * * 5"
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # WEEKLY_SUMMARY=true only on the Friday 4pm UTC schedule
          WEEKLY_SUMMARY: ${{ github.event.schedule == '0 16 * * 5' && 'true' || '' }}
        run: python monitor.py
